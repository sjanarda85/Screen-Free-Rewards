name: Build mobile apps
# Run it from the Actions tab: "Build mobile apps" -> Run workflow.
# Android: a ready-to-install APK appears under Artifacts. iOS: an unsigned simulator build is made;
# an installable iPhone build (IPA) needs an Apple Developer account, see mobile/README.md.
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
        working-directory: mobile
      - run: npm run android:sync
        working-directory: mobile
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: screen-free-rewards-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: mobile
      - run: npm run ios:sync
        working-directory: mobile
      - run: pod install
        working-directory: mobile/ios/App
      - run: |
          xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios
      - uses: actions/upload-artifact@v4
        with:
          name: screen-free-rewards-ios-simulator-app
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/App.app
